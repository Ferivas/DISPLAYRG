; Display SAC-A — Optiboot Bootloader for ATMEGA328 / ATMEGA328P
; Crystal: 7.3728 MHz | Upload: USBASP | LED: PC2 (active high)
;
; Build:   make              (primary build tool)
; Flash:   make upload       (or: make upload328p)
; Serial:  pio device monitor (after bootloader is flashed)
;
; USBASP wiring: MOSI→PB3, MISO→PB4, SCK→PB5, RESET→PB0, VCC, GND
;
; Note: The primary build tool is 'make'. PlatformIO is not used for building
; the bootloader due to source file compatibility issues. PlatformIO config
; below is for reference when using 'pio run' for serial upload after
; bootloader is installed.

[env:atmega328]
platform = atmelavr
board = 328p8m

; ATMEGA328 @ 7.3728 MHz external crystal
board_build.f_cpu = 7372800L
board_build.mcu = atmega328p

; Upload via USBASP
upload_protocol = usbasp

; Fuse settings for boot section (512 bytes, BOOTRST=0, SPIEN=1)
; LFUSE=F7: External crystal 3-8 MHz, start-up 14CK+65ms
; HFUSE=DE:  512 words boot section, SPIEN enabled
; EFUSE=FD:  2.7V brownout detector
board_build.fuse_high = DE
board_build.fuse_low = F7
board_build.fuse_extended = FD

monitor_speed = 38400
monitor_filters = direct

[env:atmega328p]
platform = atmelavr
board = 328p8m

; ATMEGA328P @ 7.3728 MHz external crystal
board_build.f_cpu = 7372800L
board_build.mcu = atmega328p

; Upload via USBASP
upload_protocol = usbasp

; Fuse settings for boot section (512 bytes, BOOTRST=0, SPIEN=1)
; LFUSE=F7: External crystal 3-8 MHz, start-up 14CK+65ms
; HFUSE=DE:  512 words boot section, SPIEN enabled
; EFUSE=FD:  2.7V brownout detector
board_build.fuse_high = DE
board_build.fuse_low = F7
board_build.fuse_extended = FD

monitor_speed = 38400
monitor_filters = direct
