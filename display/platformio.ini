; Display SAC-A — 8x32 RG LED Matrix Driver
; ATMEGA328 / ATMEGA328P @ 7.3728 MHz | Upload: USBASP | LED: PC2 (active high)
;
; Build:   make              (or: pio run)
; Flash:   make upload       (ATMEGA328 via USBASP)
;          make upload328p   (ATMEGA328P via USBASP)
; Serial:  pio device monitor
;
; USBASP wiring: MOSI→PB3, MISO→PB4, SCK→PB5, RESET→PB0, VCC, GND
;
; Fuse settings (no bootloader):
;   HFUSE=0xD9: Full flash, SPIEN enabled, reset at start
;   LFUSE=0xFF: External crystal, full power
;   EFUSE=0xFD: 2.7V brownout detector

[platformio]
default_envs = atmega328

[env:atmega328]
platform = atmelavr
board = 328p8m
framework = arduino

; ATMEGA328 @ 7.3728 MHz external crystal
board_build.f_cpu = 7372800L
board_build.mcu = atmega328

; Upload via USBASP
upload_protocol = usbasp

; Fuse settings (no bootloader)
board_build.fuse_high = D9
board_build.fuse_low = FF
board_build.fuse_extended = FD
upload_flags = -B 100

monitor_speed = 9600
monitor_filters = direct

[env:atmega328p]
platform = atmelavr
board = 328p8m
framework = arduino

; ATMEGA328P @ 7.3728 MHz external crystal
board_build.f_cpu = 7372800L
board_build.mcu = atmega328p

; Upload via USBASP
upload_protocol = usbasp

; Fuse settings (no bootloader)
board_build.fuse_high = D9
board_build.fuse_low = FF
board_build.fuse_extended = FD
upload_flags = -B 100

monitor_speed = 9600
monitor_filters = direct
